name: PR Checks

on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Validate app config (all variants)
        run: |
          set -e
          for v in development preview production; do
            echo "--- $v ---"
            APP_VARIANT=$v npx expo config --type public --json > "/tmp/config-$v.json"
            node -e "
              const c = require('/tmp/config-$v.json');
              const pkg = c.android?.package;
              const variant = c.extra?.appVariant;
              if (!pkg) throw new Error('missing android.package');
              if (variant !== '$v') throw new Error('appVariant mismatch: ' + variant);
              console.log(pkg, '|', c.name, '|', variant);
            "
          done